name: Fix WordPress filesystem (production)

on:
  workflow_dispatch:

concurrency:
  group: production-filesystem-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repair wp-content permissions and log diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            REPO=/var/www/html/domain/explorejawai.com/repo
            PUBLIC=/var/www/html/domain/explorejawai.com/public_html
            cd "${REPO}"
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            bash "${REPO}/deploy/fix-wp-content-permissions.sh" "${PUBLIC}"
            echo "--- wp-config (filesystem-related) ---"
            wp --allow-root --path="${PUBLIC}" config get FS_METHOD 2>/dev/null || true
            wp --allow-root --path="${PUBLIC}" config get DISALLOW_FILE_MODS 2>/dev/null || true
            php -r 'echo "open_basedir=", ini_get("open_basedir"), PHP_EOL;' 2>/dev/null || true