name: Deploy to explorejawai.com

on:
  push:
    branches: [main]
  workflow_dispatch:
# Editorial redesign lives on branch `editorial-local` until owner approves production.
# Pushes to `editorial-local` do not trigger this workflow.

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            bash /var/www/html/domain/explorejawai.com/repo/deploy/pull.sh